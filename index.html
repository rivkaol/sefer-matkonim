                            <p>
                              התחלתי לנסות, לשנות, לשפר. מתוך מאות ניסויים נולדו המתכונים האלה - אלה שעובדים. בכל פעם.
                              ושבני המשפחה אוכלים ואומרים <span className="font-bold">"זה טעים כמו רגיל!"</span>
                            </p>
                          </div>
                       </div>
                       
                       <div className="order-1 md:order-2 relative">
                         <div className="absolute inset-0 bg-accent rounded-full transform translate-x-4 translate-y-4 opacity-20 blur-md"></div>
                         <div className="relative w-full aspect-square rounded-full overflow-hidden border-[10px] border-white shadow-2xl bg-gray-100 flex items-center justify-center">
                            {/* Portrait Image */}
                            <img src="profile.jpg.jpg" alt="רבקה הולצברג" className="w-full h-full object-cover" />
                         </div>
                         <div className="absolute -bottom-4 -left-4 bg-white p-4 rounded-xl shadow-lg border-r-4 border-primary max-w-[180px]">
                            <p className="text-sm font-medium text-primary">"הבריאות מתחילה במטבח שמח"</p>
                         </div>
                       </div>
                    </div>
                  </div>
                </div>
              </section>

              {/* What's Inside - Features */}
              <section id="preview" className="py-24 bg-primary text-white relative overflow-hidden">
                 <div className="absolute inset-0 opacity-10" style={{backgroundImage: 'radial-gradient(#ffffff 1.5px, transparent 1.5px)', backgroundSize: '30px 30px'}}></div>
                 <div className="absolute bottom-0 left-0 w-full h-32 bg-gradient-to-t from-[#1B4D3E] to-transparent z-10"></div>
                 
                 <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-20">
                    <div className="text-center mb-20">
                      <h2 className="text-3xl md:text-5xl font-bold mb-6">מה מחכה לך בפנים?</h2>
                      <p className="text-xl text-green-100/80 font-light max-w-2xl mx-auto">+ מתכוני בסיס, טיפים למטבח הבריא והמלצות שלי. הכל מוסבר צעד אחר צעד.</p>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6 mb-20">
                      {features.map((feature, idx) => (
                        <div key={idx} className="bg-white/5 backdrop-blur-md p-6 rounded-2xl border border-white/10 text-center hover:bg-white/10 hover:-translate-y-2 transition duration-300 group">
                          <div className="text-accent mb-4 flex justify-center group-hover:scale-110 transition duration-300">{feature.icon}</div>
                          <p className="font-medium text-sm md:text-base">{feature.text}</p>
                        </div>
                      ))}
                    </div>

                    {/* Recipe Teaser - Dynamic Carousel */}
                    <div className="relative">
                       <div className="glass-card rounded-[32px] p-2 md:p-6 bg-white text-gray-800 max-w-5xl mx-auto shadow-2xl transition-all duration-300">
                         <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                           
                           {/* Recipe Image */}
                           <div className="h-72 md:h-96 bg-gray-100 rounded-2xl flex items-center justify-center relative overflow-hidden group">
                              <div className="absolute inset-0 bg-black/10 group-hover:bg-black/0 transition duration-500 pointer-events-none"></div>
                              <img 
                                src={recipes[currentRecipe].image} 
                                alt={recipes[currentRecipe].title}
                                className="w-full h-full object-cover"
                              />
                              <div className="absolute bottom-6 left-6 bg-white/90 backdrop-blur-sm px-4 py-2 rounded-full text-sm font-bold text-primary shadow-lg flex items-center gap-2">
                                <Star size={14} className="fill-accent text-accent"/> {recipes[currentRecipe].tag}
                              </div>
                           </div>

                           {/* Recipe Text */}
                           <div className="text-right p-6 md:pl-12">
                              <div className="text-accent text-sm font-bold tracking-widest uppercase mb-2">הצצה למתכון</div>
                              <h3 className="text-3xl md:text-4xl font-bold text-primary mb-4 transition-all duration-300">{recipes[currentRecipe].title}</h3>
                              <p className="text-gray-600 mb-8 text-lg leading-relaxed min-h-[80px]">
                                {recipes[currentRecipe].desc}
                                <br/><br/>
                                <span className="font-medium text-primary flex items-center gap-2">
                                   <Clock size={16} className="text-accent"/> זמן הכנה: {recipes[currentRecipe].time} | רמת קושי: {recipes[currentRecipe].difficulty}
                                </span>
                              </p>
                              
                              <div className="flex gap-4">
                                 <button onClick={nextRecipe} className="p-3 rounded-full border border-gray-200 hover:bg-primary hover:text-white hover:border-primary transition duration-300"><ChevronRight size={24} /></button>
                                 <button onClick={prevRecipe} className="p-3 rounded-full border border-gray-200 hover:bg-primary hover:text-white hover:border-primary transition duration-300"><ChevronLeft size={24} /></button>
                              </div>
                           </div>
                         </div>
                       </div>
                       
                       <div className="text-center mt-12">
                         {/* Button scrolls to purchase, no price displayed - Button 2 */}
                         <a href="#purchase" className="btn-gold inline-flex items-center gap-3 px-12 py-5 rounded-full font-bold text-xl shadow-xl hover:shadow-gold/40 transition-all group">
                            <span>אני רוצה את הספר</span>
                            <ArrowLeft size={24} className="group-hover:-translate-x-1 transition-transform" />
                         </a>
                       </div>
                    </div>
                 </div>
              </section>

              {/* Target Audience */}
              <section className="py-24 bg-gradient-to-b from-white to-gray-50" id="target-audience">
                <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="text-center mb-16">
                    <h2 className="text-3xl md:text-4xl font-bold text-primary flex justify-center items-center gap-3">
                      <Target className="text-accent w-10 h-10" />
                      הספר הזה נכתב במיוחד בשבילך אם:
                    </h2>
                  </div>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
                    {[
                      "את רוצה לשמור על הבריאות בלי להסתבך במטבח",
                      "יש לך רגישות לגלוטן, סוכרת או צורך תזונתי מיוחד",
                      "את מתגעגעת לדפדף בספר פיזי במקום במסך",
                      "נמאס לך ממתכונים שנראים טוב אבל יוצאים רע",
                      "חשוב לך שהאוכל יהיה טעים באמת לכל המשפחה",
                      "את רוצה שליטה מלאה על מה שנכנס לגוף שלך"
                    ].map((item, idx) => (
                      <div key={idx} className="flex items-start gap-5 p-6 rounded-2xl bg-white border border-gray-100 hover:border-green-200 hover:shadow-lg transition duration-300 cursor-default">
                        <div className="bg-green-50 p-2 rounded-full text-primary shrink-0 mt-1">
                          <Check size={18} strokeWidth={3} className="text-primary" />
                        </div>
                        <p className="text-lg text-gray-700 font-medium">{item}</p>
                      </div>
                    ))}
                  </div>

                  {/* Button 3 - Below Target Audience */}
                  <div className="text-center mt-8">
                        <a href="#purchase" className="btn-gold inline-flex items-center gap-3 px-10 py-4 rounded-full font-bold text-lg shadow-lg hover:shadow-gold/40 transition-all">
                            כן, זה מדבר אליי
                        </a>
                  </div>

                  {/* Quiet Digital Mention */}
                  <div className="text-center mt-8 p-4">
                      <p className="text-gray-600 text-sm md:text-base">
                          ואם כרגע נוח לך רק בפורמט דיגיטלי – <br className="md:hidden"/>
                          <a href={digitalLink} className="text-primary underline decoration-accent/50 hover:decoration-accent decoration-2 underline-offset-4 font-medium transition-all">
                              קיימת גם גרסה דיגיטלית נפרדת למי שצריכה פתרון נגיש יותר
                          </a>
                      </p>
                  </div>
                </div>
              </section>

              {/* Testimonials */}
              <section id="testimonials" className="py-24 bg-[#1B4D3E]/5 relative">
                <div className="max-w-6xl mx-auto px-4 text-center">
                  <h2 className="text-3xl md:text-4xl font-bold text-primary mb-16">נשים מספרות על השינוי במטבח</h2>
                  
                  <div className="flex flex-col md:flex-row items-center justify-center gap-8">
                      {/* Desktop Navigation: Prev (Right in RTL) */}
                      <button onClick={prevTestimonial} className="hidden md:block p-4 rounded-full bg-white shadow-lg hover:scale-110 transition text-primary hover:text-accent z-10">
                        <ChevronRight size={32} />
                      </button>
                      
                      <div className="relative glass-card p-8 md:p-12 rounded-[40px] shadow-2xl transition-all duration-500 min-h-[300px] flex flex-col justify-center items-center w-full max-w-2xl">
                         <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-accent text-white p-3 rounded-full shadow-lg">
                            <Heart className="fill-current" size={24} />
                         </div>
                         
                         {/* Shiny Stars */}
                         <div className="mb-6 flex justify-center gap-2 mt-2">
                            {[...Array(5)].map((_, i) => (
                              <Star key={i} className="text-transparent" fill="url(#gold-gradient)" size={28} strokeWidth={0} />
                            ))}
                         </div>
                         
                         {/* Recommendation Image */}
                         <div className="flex flex-col items-center gap-4 w-full">
                            <div className="w-full max-w-md h-auto rounded-lg bg-gray-100 border-2 border-dashed border-gray-300 flex flex-col items-center justify-center p-2 transform rotate-1 hover:rotate-0 transition duration-300 shadow-sm hover:border-accent overflow-hidden">
                               <img 
                                src={testimonials[currentTestimonial].image} 
                                alt="המלצה"
                                className="w-full h-auto object-contain max-h-[500px]"
                               />
                            </div>
                         </div>
                      </div>

                      {/* Desktop Navigation: Next (Left in RTL) */}
                      <button onClick={nextTestimonial} className="hidden md:block p-4 rounded-full bg-white shadow-lg hover:scale-110 transition text-primary hover:text-accent z-10">
                        <ChevronLeft size={32} />
                      </button>
                  </div>

                  {/* Mobile Navigation (Below) */}
                  <div className="flex justify-center gap-6 mt-8 md:hidden">
                     <button onClick={prevTestimonial} className="p-4 rounded-full bg-white shadow-lg text-primary hover:text-accent"><ChevronRight size={24} /></button>
                     <button onClick={nextTestimonial} className="p-4 rounded-full bg-white shadow-lg text-primary hover:text-accent"><ChevronLeft size={24} /></button>
                  </div>
                </div>
              </section>

              {/* FAQ */}
              <section id="faq" className="py-24">
                <div className="max-w-3xl mx-auto px-4">
                  <h2 className="text-3xl font-bold text-center text-primary mb-12">שאלות נפוצות</h2>
                  
                  <div className="space-y-4">
                    {[
                      {
                        q: "הספר מתאים גם למי שלא מבינה בבישול?",
                        a: "בוודאי! המתכונים נכתבו מתוך מחשבה על פשטות וקלות. כל שלב מוסבר בבהירות, והתוצאות תמיד מרשימות."
                      },
                      {
                        q: "האם המרכיבים נגישים?",
                        a: "כן. רוב המרכיבים זמינים בכל סופר. עבור המיוחדים יותר, הוספתי מדריך רכישה מפורט והמלצות לתחליפים."
                      },
                      {
                        q: "הילדים יאכלו את זה?",
                        a: "זו השאלה הכי חשובה. התשובה היא כן חד משמעי. הספר נבנה מתוך הבית שלי, והילדים הם המבקרים הכי קשוחים שלי."
                      },
                      {
                        q: "מתי אקבל את הספר?",
                        a: "הגרסה הדיגיטלית נוחתת אצלך במייל מיד לאחר הרכישה. הגרסה המודפסת יוצאת למשלוח תוך 24 שעות."
                      }
                    ].map((item, index) => (
                      <div key={index} className={`glass-card rounded-2xl overflow-hidden transition-all duration-300 ${openFaq === index ? 'border-accent shadow-md' : 'border-white'}`}>
                        <button 
                          onClick={() => toggleFaq(index)}
                          className="w-full p-6 text-right flex justify-between items-center hover:bg-white/50 transition"
                        >
                          <span className={`font-bold text-lg ${openFaq === index ? 'text-primary' : 'text-gray-800'}`}>{item.q}</span>
                          <div className={`p-2 rounded-full ${openFaq === index ? 'bg-primary text-white' : 'bg-gray-100 text-gray-500'}`}>
                            <ChevronLeft size={20} className={`transform transition-transform duration-300 ${openFaq === index ? '-rotate-90' : ''}`} />
                          </div>
                        </button>
                        <div className={`px-6 text-gray-600 bg-white/40 transition-all duration-300 overflow-hidden ${openFaq === index ? 'max-h-40 py-6 opacity-100' : 'max-h-0 py-0 opacity-0'}`}>
                          {item.a}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>

              {/* Pricing / Final CTA - The ONLY place with numbers */}
              <section id="purchase" className="py-24 bg-primary relative overflow-hidden text-center">
                 <div className="absolute inset-0 bg-pattern opacity-10"></div>
                 <div className="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-accent to-transparent opacity-50"></div>
                 
                 <div className="max-w-4xl mx-auto px-4 relative z-10">
                    <h2 className="text-3xl md:text-6xl font-black text-white mb-8 tracking-tight">הזמן שלך לבשל באהבה<br/>מתחיל כאן.</h2>
                    
                    <div className="bg-white rounded-[40px] p-8 md:p-14 shadow-2xl max-w-lg mx-auto transform hover:scale-105 transition duration-500 relative border-8 border-white/20 bg-clip-padding">
                       
                       <div className="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/2 gold-badge-shine text-white px-8 py-3 rounded-full font-bold shadow-xl text-lg uppercase tracking-wider whitespace-nowrap border-2 border-white/30 z-20">
                          מחיר השקה מיוחד
                       </div>

                       <h3 className="text-2xl font-bold text-primary mb-2 mt-4">המטבח הבריא שלי</h3>
                       <p className="text-gray-500 mb-8 font-medium">מהדורה מודפסת יוקרתית + עותק דיגיטלי</p>
                       
                       {/* Price Display */}
                       <div className="flex flex-col items-center justify-center mb-6">
                         <span className="text-2xl text-gray-400 line-through decoration-red-400 decoration-2 mb-1">₪129</span>
                         <div className="flex items-start gap-1">
                            <span className="text-3xl font-bold text-primary mt-2">₪</span>
                            <span className="text-7xl font-black text-primary leading-none">99</span>
                         </div>
                       </div>
                       
                       <div className="mb-8 flex justify-center">
                          <div className="bg-green-50 px-4 py-2 rounded-full flex items-center gap-2 text-primary font-medium text-sm">
                             <Gift size={16} className="text-accent" /> כולל גישה מיידית לגרסה הדיגיטלית
                          </div>
                       </div>
                       
                       {/* Button 5 - Final Sale */}
                       <a href={purchaseLink} target="_blank" rel="noopener noreferrer" className="w-full btn-gold py-5 rounded-full font-bold text-xl shadow-xl shadow-gold/30 mb-6 flex justify-center items-center gap-3 group">
                         <span>כן, אני רוצה את הספר!</span>
                         <ArrowLeft className="group-hover:-translate-x-1 transition-transform"/>
                       </a>
                       
                       <div className="flex justify-center gap-6 text-xs text-gray-400 font-medium uppercase tracking-wide">
                         <span className="flex items-center gap-1"><Check size={14} className="text-green-500"/> תשלום מאובטח</span>
                         <span className="flex items-center gap-1"><Check size={14} className="text-green-500"/> משלוח מהיר</span>
                       </div>
                    </div>
                 </div>
              </section>

              {/* Footer */}
              <footer className="bg-[#153e32] text-white py-20 text-center border-t border-white/5">
                <div className="max-w-3xl mx-auto px-4 space-y-8">
                   
                   <div>
                     <h3 className="text-xl font-bold mb-4 text-accent">רבקה הולצברג</h3>
                     <p className="text-gray-400 leading-relaxed max-w-lg mx-auto">
                       מלווה נשים בדרך לשינוי אמיתי דרך תזונה טבעית.
                       מאמינה שבריאות מתחילה במטבח שמח, פשוט וטעים.
                     </p>
                   </div>
                   
                   <div className="pt-8">
                     <div className="flex justify-center gap-6 mb-8">
                        <a href="#" className="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center hover:bg-accent hover:text-white transition duration-300"><Instagram size={20}/></a>
                        <a href="#" className="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center hover:bg-accent hover:text-white transition duration-300"><Facebook size={20}/></a>
                        <a href="#" className="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center hover:bg-accent hover:text-white transition duration-300"><Mail size={20}/></a>
                     </div>
                     <p className="text-sm text-gray-400">
                       בריאות שבאה מהטבע | מועדון הפרימיום של רבקה הולצברג
                     </p>
                   </div>
                </div>
              </footer>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LandingPage />);
    </script>
</body>
</html>
